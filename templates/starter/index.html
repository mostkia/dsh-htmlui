<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--dsh-htmlui-bg, #fff);
        color: var(--dsh-htmlui-fg, #111);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      h1 {
        flex: 1 1 auto;
        margin: 0;
        font-size: 16px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--dsh-htmlui-border, #ddd);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button[data-primary] {
        border-color: var(--dsh-htmlui-accent, #247bbf);
        color: var(--dsh-htmlui-accent, #247bbf);
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      #status {
        margin-top: 12px;
        color: var(--dsh-htmlui-muted, #888);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
      <button data-primary id="ask">请模型更新数据</button>
      <button id="local">纯本地计数</button>
    </header>
    <ul id="items">
      <li>把这里换成真实内容：表格、图表、表单都可以。</li>
    </ul>
    <div id="status">本地状态：0 次点击</div>

    <script>
      // Local-first: anything the document can decide itself stays here.
      var clicks = 0;
      var status = document.getElementById('status');
      var state = dshHTML.state.get();
      if (state && typeof state.clicks === 'number') {
        clicks = state.clicks;
        status.textContent = '本地状态：' + clicks + ' 次点击（来自服务端状态）';
      }

      document.getElementById('local').addEventListener('click', function () {
        clicks += 1;
        status.textContent = '本地状态：' + clicks + ' 次点击';
        dshHTML.state.set({ clicks: clicks });
      });

      // Only interactions that need the model cross the bridge.
      document.getElementById('ask').addEventListener('click', function () {
        status.textContent = '已请求模型更新…';
        dshHTML.send('refresh', { scope: 'items' });
      });

      dshHTML.on('assistant', function (event) {
        if (event.type === 'text') status.textContent = '模型输出：' + event.text.slice(0, 120);
      });
    </script>
  </body>
</html>
